      # - name: Azure login (optional FinOps hub landing)
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ vars.AZURE_CLIENT_ID }}
      #     tenant-id: "<YOUR_ENTRA_TENANT_ID>"
      #     subscription-id: "<YOUR_AZURE_SUBSCRIPTION_ID>"
      #
      # - name: Upload Parquet and trigger FinOps hub ingestion (optional)
      #   shell: bash
      #   run: |
      #     azcopy copy ".copilot-usage-out/*.parquet" \
      #       "https://<YOUR_STORAGE_ACCOUNT>.dfs.core.windows.net/<YOUR_CONTAINER>/ingestion/<YOUR_DATASET>/$(date -u +%Y/%m)/<YOUR_SCOPE_PATH>/" \
      #       --recursive=false
      #     # Write an empty manifest.json only after all dataset files are complete.
      #     printf '{}' > manifest.json
      #     azcopy copy manifest.json \
      #       "https://<YOUR_STORAGE_ACCOUNT>.dfs.core.windows.net/<YOUR_CONTAINER>/ingestion/<YOUR_DATASET>/$(date -u +%Y/%m)/<YOUR_SCOPE_PATH>/manifest.json"
